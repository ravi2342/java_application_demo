# Spring Boot Application Configuration
# ====================================

# Application name and description
spring.application.name=Java Demo App - Spring Boot REST API
server.servlet.context-path=/

# Server configuration
server.port=9090
server.address=0.0.0.0
server.shutdown=graceful

# Logging configuration (useful for DevOps and debugging)
logging.level.root=INFO
logging.level.com.demo=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator endpoints (for DevOps monitoring)
# Health check: http://localhost:8080/actuator/health
# Endpoints list: http://localhost:8080/actuator
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# Application info for actuator
info.app.name=Java Demo Application
info.app.description=Spring Boot REST API for Maven and DevOps teaching
info.app.version=1.0.0
info.company.name=DevOps Bootcamp
